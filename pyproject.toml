[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "vintage-lakehouse"
dynamic = ["version"]
description = "Point-in-time (bitemporal) lakehouse for revised data, with a replay harness that measures how much forecast accuracy is inflated by hindsight."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["lakehouse", "bitemporal", "time-travel", "data-leakage", "forecasting", "data-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime dependencies are added branch by branch, only when first used
# (see docs/ROADMAP.md). The skeleton intentionally has none.
dependencies = []

[project.optional-dependencies]
# Iceberg-backed store (feature/iceberg-store). Lower bounds are the versions it was tested with.
iceberg = [
    "pyiceberg[sql-sqlite,pyarrow]>=0.12",
    "duckdb>=1.5",
]
# ETS and gradient boosting baselines (feature/baseline-forecasters). Lower bounds are the
# versions they were tested with.
baselines = [
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
dev = [
    "vintage-lakehouse[iceberg,baselines]",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
vintage-lakehouse = "vintage_lakehouse.cli:main"

[tool.hatch.version]
path = "src/vintage_lakehouse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vintage_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are deselected by default. Run them with: pytest -m network
addopts = "-ra --strict-markers -m 'not network' --cov=vintage_lakehouse --cov-report=term-missing"
markers = [
    "slow: long-running tests (benchmarks, large replays)",
    "network: tests that need network access to a data source",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vintage_lakehouse"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = [
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "pandas.*",
    "statsmodels",
    "statsmodels.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["vintage_lakehouse"]
